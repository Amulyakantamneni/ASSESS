<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Your Assessment | MaturityAssess</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
    .flow-wrap { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }

    .stepper { display: flex; justify-content: space-between; margin-bottom: 3rem; flex-wrap: wrap; gap: 0.5rem; }
    .stepper .step-pill {
        flex: 1; min-width: 140px; text-align: center; padding: 0.75rem 0.5rem; border-radius: 8px;
        font-size: 0.85rem; font-weight: 600; color: var(--muted); background: white; border: 1px solid var(--border);
        transition: all 0.3s ease;
    }
    .stepper .step-pill.active { color: var(--primary); border-color: var(--accent); background: var(--light-accent); }
    .stepper .step-pill.done { color: white; background: var(--success); border-color: var(--success); }

    .panel { background: white; border-radius: 14px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    .panel h2 { color: var(--primary); margin-bottom: 0.5rem; font-size: 1.6rem; }
    .panel .hint { color: var(--muted); margin-bottom: 1.75rem; }

    .choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .choice-card {
        border: 2px solid var(--border); border-radius: 10px; padding: 1.25rem; cursor: pointer;
        transition: all 0.2s ease; background: white;
    }
    .choice-card:hover { border-color: var(--accent); background: var(--light-accent); transform: translateY(-2px); }
    .choice-card h4 { color: var(--dark); margin-bottom: 0.4rem; font-size: 1rem; }
    .choice-card p { color: var(--muted); font-size: 0.85rem; }

    .tier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    @media (max-width: 640px) { .tier-grid { grid-template-columns: 1fr; } }
    .tier-card { border: 2px solid var(--border); border-radius: 12px; padding: 1.5rem; cursor: pointer; transition: all 0.2s ease; }
    .tier-card.selected { border-color: var(--primary); background: var(--light-accent); }
    .tier-card h4 { color: var(--primary); margin-bottom: 0.5rem; }
    .tier-card ul { margin: 0.75rem 0 0 1.1rem; color: var(--muted); font-size: 0.88rem; }

    .quiz-progress { height: 6px; background: var(--border); border-radius: 4px; margin-bottom: 1.5rem; overflow: hidden; }
    .quiz-progress-bar { height: 100%; background: linear-gradient(135deg, var(--primary), var(--accent)); width: 0%; transition: width 0.3s ease; }
    .quiz-question { font-weight: 700; margin-bottom: 0.4rem; font-size: 1.15rem; }
    .quiz-category { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 1rem; }
    .quiz-options { display: flex; flex-direction: column; gap: 0.6rem; }
    .quiz-option {
        display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.9rem 1rem;
        border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
    }
    .quiz-option:hover { border-color: var(--accent); background: var(--light-accent); }
    .quiz-option.selected { border-color: var(--primary); background: var(--light-accent); box-shadow: 0 4px 12px rgba(15,58,125,0.1); }
    .quiz-nav { display: flex; justify-content: space-between; margin-top: 1.75rem; gap: 1rem; }

    .results-level { text-align: center; padding: 1.5rem; border-radius: 12px; background: var(--light-accent); margin-bottom: 1.5rem; }
    .results-level .level-name { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .score-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
    .score-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem; text-align: center; }
    .score-card .val { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
    .score-card .lbl { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.3rem; }

    .gauge-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.25rem; margin-bottom: 1.75rem; }
    .gauge-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; }
    .gauge-ring { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 0.6rem; display: flex; align-items: center; justify-content: center; transition: background 1s ease; }
    .gauge-ring span { background: white; width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--primary); font-size: 1.05rem; }
    .gauge-card .lbl { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.4rem; }
    .gauge-card .val-plain { font-size: 1.6rem; font-weight: 800; color: var(--primary); text-transform: capitalize; }

    .viz-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .viz-tab-btn { border: 1px solid var(--border); background: white; padding: 0.5rem 1.1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; }
    .viz-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .chart-wrap { position: relative; height: 320px; margin-bottom: 2rem; }
    .heatmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; margin-bottom: 2rem; }
    .heat-cell { border-radius: 10px; padding: 1rem; color: white; transition: transform 0.2s ease; }
    .heat-cell:hover { transform: scale(1.04); }
    .heat-cell .hc-score { font-size: 1.5rem; font-weight: 800; }
    .heat-cell .hc-label { font-size: 0.8rem; opacity: 0.95; margin-top: 0.25rem; line-height: 1.3; }

    .panel-fade { animation: panelFade 0.35s ease-out; }
    @keyframes panelFade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .explain-btn { font-size: 0.78rem; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; font-weight: 600; }
    .explain-text { display: none; margin-top: 0.5rem; font-size: 0.85rem; color: var(--primary); background: var(--light-accent); padding: 0.6rem 0.75rem; border-radius: 6px; }
    .explain-text.visible { display: block; }

    /* ---------------- Results dashboard sections ---------------- */
    .results-section { margin-top: 2.75rem; padding-top: 2.75rem; border-top: 1px solid var(--border); }
    .results-section:first-of-type { margin-top: 2rem; padding-top: 0; border-top: none; }
    .results-section h3 { color: var(--primary); font-size: 1.35rem; margin-bottom: 0.4rem; }
    .results-section .section-note { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.25rem; }

    /* Maturity progression bar */
    .progression-bar { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
    .progression-stage {
        flex: 1; text-align: center; padding: 0.85rem 0.4rem; border-radius: 10px; cursor: pointer;
        border: 2px solid var(--border); background: white; transition: all 0.2s ease; font-size: 0.8rem;
    }
    .progression-stage:hover { border-color: var(--accent); }
    .progression-stage .ps-num { font-weight: 800; color: var(--muted); font-size: 0.95rem; }
    .progression-stage .ps-name { font-weight: 700; color: var(--dark); margin-top: 0.15rem; }
    .progression-stage.done { border-color: var(--success); background: rgba(16,185,129,0.06); }
    .progression-stage.done .ps-num { color: var(--success); }
    .progression-stage.current { border-color: var(--primary); background: var(--light-accent); box-shadow: 0 4px 14px rgba(15,58,125,0.15); }
    .progression-stage.current .ps-num, .progression-stage.current .ps-name { color: var(--primary); }
    @media (max-width: 640px) { .progression-bar { flex-wrap: wrap; } .progression-stage { min-width: 30%; } }

    /* Heatmap cell additions */
    .heat-cell { cursor: pointer; position: relative; }
    .heat-cell .hc-status { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.9; margin-top: 0.35rem; }
    .heat-cell .hc-level { position: absolute; top: 0.7rem; right: 0.8rem; font-size: 0.72rem; font-weight: 800; background: rgba(255,255,255,0.3); padding: 0.1rem 0.45rem; border-radius: 999px; }

    /* Strengths / Weaknesses */
    .sw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 640px) { .sw-grid { grid-template-columns: 1fr; } }
    .sw-col h4 { font-size: 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.4rem; }
    .sw-col.strengths h4 { color: var(--success); }
    .sw-col.weaknesses h4 { color: var(--danger); }
    .sw-item {
        display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
        background: white; border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem;
        margin-bottom: 0.6rem; cursor: pointer; transition: all 0.2s ease;
    }
    .sw-item:hover { border-color: var(--accent); transform: translateX(3px); }
    .sw-item .sw-score { font-weight: 800; color: var(--primary); font-size: 0.9rem; flex-shrink: 0; }

    /* Gap analysis cards (accordion) */
    .gap-card { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 0.9rem; overflow: hidden; }
    .gap-card-head { width: 100%; text-align: left; background: white; border: none; padding: 1.1rem 1.25rem; cursor: pointer; display: flex; align-items: center; gap: 0.9rem; font: inherit; }
    .gap-card-head:hover { background: var(--light); }
    .gap-priority-pill { flex-shrink: 0; font-size: 0.72rem; font-weight: 800; padding: 0.3rem 0.7rem; border-radius: 999px; color: white; text-transform: uppercase; letter-spacing: 0.02em; }
    .gap-card-head .gc-title { flex: 1; font-weight: 700; color: var(--dark); }
    .gap-card-head .gc-caret { color: var(--muted); transition: transform 0.25s ease; flex-shrink: 0; }
    .gap-card.open .gc-caret { transform: rotate(180deg); }
    .gap-card-body { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.22,1,0.36,1); }
    .gap-card-inner { padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .gap-levels { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; font-size: 0.9rem; }
    .gap-levels .gl-badge { background: var(--light-accent); color: var(--primary); font-weight: 700; padding: 0.35rem 0.8rem; border-radius: 8px; }
    .gap-card-inner p { color: var(--dark); font-size: 0.9rem; margin-bottom: 0.6rem; line-height: 1.6; }
    .gap-card-inner p strong { color: var(--primary); }

    /* Top priorities */
    .priority-item { display: flex; gap: 1rem; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 0.8rem; }
    .priority-rank { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; }
    .priority-body { flex: 1; min-width: 0; }
    .priority-body .pb-title { font-weight: 700; color: var(--dark); margin-bottom: 0.35rem; }
    .priority-stats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
    .priority-stat { font-size: 0.75rem; font-weight: 700; padding: 0.22rem 0.6rem; border-radius: 999px; background: var(--light); color: var(--muted); }
    .priority-body p { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
    .priority-body .pb-reason { font-style: italic; color: var(--accent); font-size: 0.8rem; margin-top: 0.4rem; }

    /* Risk matrix */
    .risk-matrix-wrap { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 1.5rem; align-items: start; min-width: 0; }
    .risk-matrix-wrap > * { min-width: 0; }
    @media (max-width: 760px) { .risk-matrix-wrap { grid-template-columns: 1fr; } }
    .risk-chart-wrap { position: relative; height: 320px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; min-width: 0; }
    .risk-chart-wrap canvas { max-width: 100%; }
    .risk-list-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem 0.75rem; background: white; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.6rem; cursor: pointer; transition: border-color 0.2s ease; }
    .risk-list-item:hover { border-color: var(--accent); }
    .risk-list-item .rl-name { font-weight: 600; color: var(--dark); font-size: 0.88rem; flex: 1 1 auto; min-width: 0; }
    .risk-list-item .rl-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; flex-shrink: 0; }
    .risk-tag { font-size: 0.68rem; font-weight: 800; padding: 0.18rem 0.5rem; border-radius: 999px; text-transform: uppercase; }

    /* AI Score Explanation */
    .ai-explain-box { background: linear-gradient(135deg, var(--light-accent), white); border-radius: 12px; padding: 1.5rem; }
    .ai-explain-text { color: var(--dark); line-height: 1.7; margin-top: 1rem; display: none; }
    .ai-explain-text.visible { display: block; animation: panelFade 0.3s ease-out; }

    /* Contact CTAs */
    .results-cta { background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 14px; padding: 1.75rem; text-align: center; color: white; margin-bottom: 1.25rem; }
    .results-cta h4 { font-size: 1.15rem; margin-bottom: 0.4rem; }
    .results-cta p { color: rgba(255,255,255,0.9); font-size: 0.9rem; margin-bottom: 1.1rem; }

    /* Shared detail modal */
    .detail-modal-overlay {
        position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 2000;
        display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .detail-modal-overlay.open { opacity: 1; pointer-events: auto; }
    .detail-modal {
        background: white; border-radius: 16px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto;
        padding: 2rem; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        transform: translateY(12px); transition: transform 0.2s ease;
    }
    .detail-modal-overlay.open .detail-modal { transform: translateY(0); }
    .detail-modal-close { position: absolute; top: 1rem; right: 1rem; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--light); font-size: 1.3rem; cursor: pointer; color: var(--muted); line-height: 1; }
    .detail-modal-close:hover { background: var(--border); }
    .detail-modal-title { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 1.1rem; padding-right: 2rem; }
    .detail-modal-body p { color: var(--dark); margin-bottom: 0.75rem; line-height: 1.6; font-size: 0.92rem; }
    .detail-modal-body p strong { color: var(--primary); }
    .dm-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .dm-row:last-child { border-bottom: none; }
    .dm-qa { background: var(--light); border-radius: 8px; padding: 0.7rem 0.85rem; margin-bottom: 0.5rem; font-size: 0.83rem; }
    .dm-qa .dm-q { font-weight: 600; color: var(--dark); margin-bottom: 0.25rem; }
    .dm-qa .dm-a { color: var(--muted); }
</style>
</head>

    <p>&copy; 2026 MaturityAssess.</p>
    <p style="margin-top:1rem;opacity:0.7;font-size:0.9rem;"><a href="/">Home</a> · <a href="/connect">Connect With Us</a> · <a href="/dashboard">Dashboard</a></p>

<script>
const STEPS = ['Industry', 'Standard', 'Assessment', 'Questions', 'Report'];
let state = {
    step: 0,
    industry: null, standard: null, template: null,
    tier: 'free', email: '',
    assessmentId: null, questions: [], currentQ: 0, answers: {},
    result: null,
};
let radarChart = null;
let riskChart = null;

const panelHost = document.getElementById('panelHost');

function renderStepper() {
    document.getElementById('stepper').innerHTML = STEPS.map((label, i) => {
        const cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
        return `<div class="step-pill ${cls}">${i < state.step ? '✓ ' : ''}${label}</div>`;
    }).join('');
}

function goTo(step) { state.step = step; renderStepper(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

async function render() {
    renderStepper();
    if (state.step === 0) return renderIndustryStep();
    if (state.step === 1) return renderStandardStep();
    if (state.step === 2) return renderTemplateStep();
    if (state.step === 3) return renderTierThenQuiz();
    if (state.step === 4) return renderResults();
}

// ---------------- Step 0: Industry ----------------
async function renderIndustryStep() {
    panelHost.innerHTML = `<div class="panel panel-fade"><h2>Choose Your Industry</h2><p class="hint">This determines which standards and frameworks apply.</p><div class="choice-grid" id="industryGrid">Loading…</div></div>`;
    const res = await fetch(`${API_BASE}/industries`);
    const data = await res.json();
    const grid = document.getElementById('industryGrid');
    if (!data.ok || !data.industries.length) { grid.innerHTML = '<p style="color:var(--muted)">No industries configured yet.</p>'; return; }
    grid.innerHTML = data.industries.map((i) => `
        <div class="choice-card" data-id="${i.id}">
            <h4>${escapeHtml(i.name)}</h4>
            <p>${escapeHtml(i.description || '')}</p>
        </div>
    `).join('');
    grid.querySelectorAll('.choice-card').forEach((card) => {
        card.addEventListener('click', () => {
            state.industry = data.industries.find((i) => i.id === card.dataset.id);
            state.standard = null; state.template = null;
            goTo(1);
        });
    });
}

// ---------------- Step 1: Standard ----------------
async function renderStandardStep() {
    panelHost.innerHTML = `<div class="panel panel-fade"><h2>Choose a Standard / Framework</h2><p class="hint">Applicable to ${escapeHtml(state.industry.name)}.</p><div class="choice-grid" id="standardGrid">Loading…</div><div class="quiz-nav"><button class="btn btn-secondary" id="backBtn">Back</button><span></span></div></div>`;
    document.getElementById('backBtn').addEventListener('click', () => goTo(0));
    const res = await fetch(`${API_BASE}/industries/${state.industry.id}/standards`);
    const data = await res.json();
    const grid = document.getElementById('standardGrid');
    if (!data.ok || !data.standards.length) { grid.innerHTML = '<p style="color:var(--muted)">No standards configured for this industry yet.</p>'; return; }
    grid.innerHTML = data.standards.map((s) => `
        <div class="choice-card" data-id="${s.id}">
            <h4>${escapeHtml(s.name)}</h4>
            <p>${escapeHtml(s.description || '')}</p>
        </div>
    `).join('');
    grid.querySelectorAll('.choice-card').forEach((card) => {
        card.addEventListener('click', () => {
            state.standard = data.standards.find((s) => s.id === card.dataset.id);
            state.template = null;
            goTo(2);
        });
    });
}

// ---------------- Step 2: Template ----------------
async function renderTemplateStep() {
    panelHost.innerHTML = `<div class="panel panel-fade"><h2>Choose Your Assessment</h2><p class="hint">Assessment types available for ${escapeHtml(state.standard.name)}.</p><div class="choice-grid" id="templateGrid">Loading…</div><div class="quiz-nav"><button class="btn btn-secondary" id="backBtn">Back</button><span></span></div></div>`;
    document.getElementById('backBtn').addEventListener('click', () => goTo(1));
    const res = await fetch(`${API_BASE}/standards/${state.standard.id}/templates`);
    const data = await res.json();
    const grid = document.getElementById('templateGrid');
    if (!data.ok || !data.templates.length) { grid.innerHTML = '<p style="color:var(--muted)">No assessment templates configured for this standard yet.</p>'; return; }
    grid.innerHTML = data.templates.map((t) => `
        <div class="choice-card" data-id="${t.id}">
            <h4>${escapeHtml(t.name)}</h4>
            <p>${escapeHtml(t.description || '')}</p>
        </div>
    `).join('');
    grid.querySelectorAll('.choice-card').forEach((card) => {
        card.addEventListener('click', () => {
            state.template = data.templates.find((t) => t.id === card.dataset.id);
            goTo(3);
        });
    });
}

// ---------------- Step 3: Tier + Quiz ----------------
function renderTierThenQuiz() {
    if (!state.assessmentId) return renderTierPicker();
    return renderQuizStep();
}

function renderTierPicker() {
    panelHost.innerHTML = `
        <div class="panel panel-fade">
            <h2>${escapeHtml(state.template.name)}</h2>
            <p class="hint">${escapeHtml(state.industry.name)} · ${escapeHtml(state.standard.name)}</p>
            <div class="tier-grid">
                <div class="tier-card selected" data-tier="free">
                    <h4>Free Assessment</h4>
                    <p style="color:var(--muted);font-size:0.88rem;">Quick scorecard, no email required.</p>
                    <ul><li>5 questions built for your standard</li><li>Basic scorecard</li><li>No downloadable report</li></ul>
                </div>

async function beginAssessment() {
    const errorEl = document.getElementById('tierError');
    errorEl.classList.remove('visible');
    if (state.tier === 'premium') {
        state.email = document.getElementById('emailInput').value.trim();
        if (!state.email || !state.email.includes('@')) {
            errorEl.textContent = 'A valid work email is required for the full personalized report.';
            errorEl.classList.add('visible');
            return;
        }
    }
    const beginBtn = document.getElementById('beginBtn');
    beginBtn.disabled = true;
    beginBtn.innerHTML = '<span class="spinner"></span> Generating questions…';
    try {
        const res = await fetch(`${API_BASE}/assessments/start`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ template_id: state.template.id, tier: state.tier, email: state.email || null }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Could not start assessment.');
        state.assessmentId = data.assessment_id;
        state.questions = data.questions;
        state.currentQ = 0;
        state.answers = {};
        renderQuizStep();
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');

        beginBtn.textContent = 'Begin Assessment';

function renderQuizStep() {
    const q = state.questions[state.currentQ];
    const progress = Math.round((state.currentQ / state.questions.length) * 100);
    const selected = state.answers[q.id];

    let bodyHtml = '';
    if (q.question_type === 'text' || q.question_type === 'evidence') {
        bodyHtml = `<textarea id="freeTextInput" rows="5" placeholder="${q.question_type === 'evidence' ? 'Describe the supporting documentation you have…' : 'Your answer…'}">${selected ? escapeHtml(selected.text || '') : ''}</textarea>`;
    } else {
        bodyHtml = `<div class="quiz-options">${q.options.map((opt) => `
            <label class="quiz-option ${selected && selected.value === opt.value ? 'selected' : ''}" data-value="${opt.value}">
                <input type="radio" name="quiz-option" ${selected && selected.value === opt.value ? 'checked' : ''} />
                <span>${escapeHtml(opt.label)}</span>
            </label>
        `).join('')}</div>`;
    }

    panelHost.innerHTML = `
        <div class="panel panel-fade">
            <div class="quiz-category">${escapeHtml(q.category)}</div>
            <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${progress}%;"></div></div>
            <div class="quiz-question">Question ${state.currentQ + 1} of ${state.questions.length}: ${escapeHtml(q.question_text)}</div>
            <div style="margin-top:1rem;">${bodyHtml}</div>
            <div class="quiz-nav">
                <button class="btn btn-secondary" id="quizBackBtn" ${state.currentQ === 0 ? 'disabled' : ''}>Back</button>
                <button class="btn btn-primary" id="quizNextBtn">${state.currentQ === state.questions.length - 1 ? 'Generate Assessment' : 'Next'}</button>
            </div>
        </div>
    `;

    if (q.question_type !== 'text' && q.question_type !== 'evidence') {
        panelHost.querySelectorAll('.quiz-option').forEach((label) => {
            label.addEventListener('click', () => {
                const value = Number(label.getAttribute('data-value'));
                const opt = q.options.find((o) => o.value === value);
                state.answers[q.id] = { value, label: opt.label };
                renderQuizStep();
            });
        });
    }

    document.getElementById('quizBackBtn').addEventListener('click', () => {
        state.currentQ = Math.max(0, state.currentQ - 1);
        renderQuizStep();
    });

    document.getElementById('quizNextBtn').addEventListener('click', () => {
        if (q.question_type === 'text' || q.question_type === 'evidence') {
            const val = document.getElementById('freeTextInput').value.trim();
            if (!val) { alert('Please provide an answer before continuing.'); return; }
            state.answers[q.id] = { text: val };
        } else if (!state.answers[q.id]) {
            return;
        }
        if (state.currentQ < state.questions.length - 1) {
            state.currentQ += 1;
            renderQuizStep();
        } else {
            submitAssessment();
        }
    });
}

async function submitAssessment() {
    panelHost.innerHTML = `<div class="panel panel-fade" style="text-align:center;"><h2>Generating your assessment…</h2><p class="hint">Claude is analyzing your responses.</p><div class="spinner" style="width:32px;height:32px;border-color:rgba(15,58,125,0.2);border-top-color:var(--primary);"></div></div>`;
    try {

            question_id: q.id,

// ---------------- Step 4: Results ----------------
const CATEGORY_ICONS = ['📄', '🔐', '⚙️', '👥', '⚖️', '🧭', '📈', '🗂️', '🎯', '🧩', '🛠️', '✅'];
function iconFor(label) {
    let hash = 0;
    for (let i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) >>> 0;
    return CATEGORY_ICONS[hash % CATEGORY_ICONS.length];
}
function heatColor(score) {
    if (score >= 4) return '#10b981';
    if (score >= 2.5) return '#f59e0b';
    return '#ef4444';
}
function animateCountUp(el, target, opts) {
    opts = opts || {};
    const duration = 1000;
    const start = performance.now();
    function tick(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = (target * eased).toFixed(opts.decimals || 0) + (opts.suffix || '');
        if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

// ---------------- Derivation rules (documented, deterministic — never per-item guesses) ----------------
// The canonical 5-stage scale. This mirrors the same fixed set the backend hard-maps free-tier
// results onto (Initial/Repeatable/Defined/Managed/Optimizing); premium's maturity_level is
// freeform AI text only loosely guided toward these names, so matching is best-effort (see
// matchLevelIndex) and the UI never claims a level the data doesn't support.
const MATURITY_LEVELS = [
    { name: 'Initial', desc: 'Processes are unpredictable and largely reactive. Success depends on individual effort rather than a repeatable process.', distinguishing: 'Moving up requires establishing basic project- and process-level discipline.' },
    { name: 'Repeatable', desc: 'Basic management processes exist to track cost, schedule, and outcomes. Similar work produces similar, repeatable results.', distinguishing: 'Moving up requires those practices to be documented and standardized organization-wide, not just habitually repeated.' },
    { name: 'Defined', desc: 'Processes are documented, standardized, and integrated into a defined organization-wide approach.', distinguishing: 'Moving up requires measuring those defined processes with quantitative data, not just following them.' },
    { name: 'Managed', desc: 'Detailed measures of the process and its outputs are collected and used to control the process quantitatively.', distinguishing: 'Moving up requires using that data to continuously and proactively improve the process itself.' },
    { name: 'Optimizing', desc: 'Continuous process improvement is enabled by quantitative feedback and by piloting new approaches.', distinguishing: 'The top of the scale — the focus becomes sustaining and refining what already works well.' },
];
function matchLevelIndex(label) {
    if (!label) return -1;
    const norm = label.trim().toLowerCase();
    const exact = MATURITY_LEVELS.findIndex((l) => l.name.toLowerCase() === norm);
    if (exact !== -1) return exact;
    const synonyms = [[/initial|ad.?hoc|reactive/, 0], [/repeat/, 1], [/defin|standard/, 2], [/manag|quantitativ/, 3], [/optim/, 4]];
    for (const [re, idx] of synonyms) if (re.test(norm)) return idx;
    return -1;
}
// Per-category level: same round-based bucketing the backend already uses once for the overall
// free-tier level, applied per category for a transparent (not fabricated) 1-5 rating.
function levelIndexForScore(score) { return Math.max(0, Math.min(4, Math.round(score) - 1)); }
function statusForScore(score) {
    if (score >= 4.5) return { label: 'Strong', color: '#10b981' };
    if (score >= 3.5) return { label: 'Good', color: '#3b82f6' };
    if (score >= 2.5) return { label: 'Improve', color: '#f59e0b' };
    return { label: 'Priority', color: '#ef4444' };
}
function priorityForGap(gap) {
    if (gap >= 2.5) return { label: 'Critical', color: '#ef4444' };
    if (gap >= 1.5) return { label: 'High', color: '#f59e0b' };
    if (gap >= 0.75) return { label: 'Medium', color: '#3b82f6' };
    return { label: 'Low', color: '#10b981' };
}
// Effort proxy: number of assessed questions in the category (via r.responses) — a real,
// data-grounded signal, not an invented one. More controls assessed = more surface area to fix.
function effortForCategory(category, responses) {
    const count = (responses || []).filter((x) => x.category === category).length;
    if (count >= 5) return 'High';
    if (count >= 3) return 'Medium';
    return count > 0 ? 'Low' : 'Unknown';
}
function riskImpact(score) { return score < 2.5 ? 'High' : score < 3.5 ? 'Medium' : 'Low'; }
function riskLikelihood(gap) { return gap >= 2.5 ? 'High' : gap >= 1.5 ? 'Medium' : 'Low'; }
const RISK_TAG_COLOR = { High: '#ef4444', Medium: '#f59e0b', Low: '#10b981' };

            document.querySelectorAll('.viz-tab-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('vizHeatmap').style.display = btn.dataset.viz === 'heatmap' ? 'grid' : 'none';
            document.getElementById('vizRadar').style.display = btn.dataset.viz === 'radar' ? 'block' : 'none';
        });
    });
    const ctx = document.getElementById('radarChart');
    if (radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: catScores.map((c) => c.category),
            datasets: [{
                label: 'Score', data: catScores.map((c) => c.score),
                borderColor: '#0f3a7d', backgroundColor: 'rgba(15,58,125,0.15)', pointBackgroundColor: '#00a8e8',
            }],
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { r: { min: 0, max: 5, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } },
    });

    // Strengths / Weaknesses
    const swItemHtml = (c) => `<div class="sw-item" data-category="${escapeHtml(c.category)}"><span>${iconFor(c.category)} ${escapeHtml(c.category)}</span><span class="sw-score">${c.score}/5</span></div>`;
    document.getElementById('strengthsList').innerHTML = strengths.map(swItemHtml).join('') || '<p class="hint">Not enough data yet.</p>';
    document.getElementById('weaknessesList').innerHTML = weaknesses.map(swItemHtml).join('') || '<p class="hint">Not enough data yet.</p>';
    document.querySelectorAll('.sw-item').forEach((el) => {
        el.addEventListener('click', () => {
            const c = catScores.find((x) => x.category === el.dataset.category);
            openCategoryModal(c, r);
        });
    });

    // Gap analysis (expandable cards)
    document.getElementById('gapAnalysisList').innerHTML = gapItems.length ? gapItems.map((c, i) => {
        const priority = priorityForGap(c.gap);
        const curIdx = levelIndexForScore(c.score);
        const targetIdx = Math.min(4, curIdx + 1);
        return `
            <div class="gap-card" data-idx="${i}">
                <button class="gap-card-head">
                    <span class="gap-priority-pill" style="background:${priority.color};">${priority.label}</span>
                    <span class="gc-title">${escapeHtml(c.category)}</span>
                    <span class="gc-caret">▾</span>
                </button>
                <div class="gap-card-body">
                    <div class="gap-card-inner">
                        <div class="gap-levels">
                            <span class="gl-badge">Current: L${curIdx + 1} — ${escapeHtml(MATURITY_LEVELS[curIdx].name)}</span>
                            <span style="color:var(--muted);">→</span>
                            <span class="gl-badge">Target: L${targetIdx + 1} — ${escapeHtml(MATURITY_LEVELS[targetIdx].name)}</span>
                        </div>
                        <p><strong>Why it matters:</strong> ${escapeHtml(c.insight)}</p>
                        <p><strong>Recommended action:</strong> ${escapeHtml(c.recommendation)}</p>
                        <p style="color:var(--muted);font-size:0.82rem;">Related category: ${escapeHtml(c.category)}</p>
                    </div>
                </div>
            </div>
        `;
    }).join('') : '<p class="hint">No significant gaps identified — nice work.</p>';
    document.querySelectorAll('.gap-card-head').forEach((btn) => {
        btn.addEventListener('click', () => {
            const card = btn.closest('.gap-card');
            const opening = !card.classList.contains('open');
            document.querySelectorAll('.gap-card.open').forEach((c) => { c.classList.remove('open'); toggleAccordion(c.querySelector('.gap-card-body'), false); });
            if (opening) { card.classList.add('open'); toggleAccordion(card.querySelector('.gap-card-body'), true); }
        });
    });

    // Top priorities
    document.getElementById('priorityList').innerHTML = priorityItems.length ? priorityItems.map((c, i) => {
        const impact = priorityForGap(c.gap);
        const effort = effortForCategory(c.category, r.responses);
        const curIdx = levelIndexForScore(c.score);
        return `
            <div class="priority-item">
                <div class="priority-rank">${i + 1}</div>
                <div class="priority-body">
                    <div class="pb-title">${escapeHtml(c.category)}</div>
                    <div class="priority-stats">
                        <span class="priority-stat">Impact: ${impact.label}</span>
                        <span class="priority-stat">Effort: ${effort}</span>
                        <span class="priority-stat">Current: L${curIdx + 1}</span>
                    </div>
                    <p>${escapeHtml(c.recommendation)}</p>
                    <p class="pb-reason">Prioritized for a ${c.gap.toFixed(1)}-point gap${(impact.label === 'Critical' || impact.label === 'High') ? ' and high organizational importance' : ''}.</p>
                </div>
            </div>
        `;
    }).join('') : '<p class="hint">No priority actions identified.</p>';

    // Risk overview
    const AXIS_VAL = { Low: 1, Medium: 2, High: 3 };
    const riskPoints = priorityItems.map((c) => ({ category: c.category, impact: riskImpact(c.score), likelihood: riskLikelihood(c.gap), c }));
    function openRiskDetail(p) {
        openDetailModal(p.category, `
            <div class="dm-row"><span>Impact</span><strong>${p.impact}</strong></div>
            <div class="dm-row"><span>Likelihood</span><strong>${p.likelihood}</strong></div>
            <div class="dm-row"><span>Related gap</span><strong>${p.c.gap}/5</strong></div>
            <p style="margin-top:1rem;"><strong>Why it was identified:</strong> ${escapeHtml(p.c.insight)}</p>
            <p><strong>Recommended action:</strong> ${escapeHtml(p.c.recommendation)}</p>
        `);
    }
    document.getElementById('riskList').innerHTML = riskPoints.length ? riskPoints.map((p, i) => `
        <div class="risk-list-item" data-idx="${i}">
            <span class="rl-name">${escapeHtml(p.category)}</span>
            <span class="rl-tags">
                <span class="risk-tag" style="background:${RISK_TAG_COLOR[p.impact]}22;color:${RISK_TAG_COLOR[p.impact]};">Impact: ${p.impact}</span>
                <span class="risk-tag" style="background:${RISK_TAG_COLOR[p.likelihood]}22;color:${RISK_TAG_COLOR[p.likelihood]};">Likelihood: ${p.likelihood}</span>
            </span>
        </div>
    `).join('') : '<p class="hint">No elevated risks identified.</p>';
    document.querySelectorAll('.risk-list-item').forEach((el) => {
        el.addEventListener('click', () => openRiskDetail(riskPoints[Number(el.dataset.idx)]));
    });
    const riskCtx = document.getElementById('riskChart');
    if (riskChart) riskChart.destroy();
    if (riskPoints.length) {
        riskChart = new Chart(riskCtx, {
            type: 'scatter',
            data: { datasets: [{
                data: riskPoints.map((p) => ({ x: AXIS_VAL[p.likelihood], y: AXIS_VAL[p.impact] })),
                backgroundColor: riskPoints.map((p) => RISK_TAG_COLOR[p.impact]), pointRadius: 9, pointHoverRadius: 12,
            }] },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { min: 0.5, max: 3.5, title: { display: true, text: 'Likelihood' }, ticks: { stepSize: 1, callback: (v) => ({ 1: 'Low', 2: 'Medium', 3: 'High' }[v] || '') } },
                    y: { min: 0.5, max: 3.5, title: { display: true, text: 'Impact' }, ticks: { stepSize: 1, callback: (v) => ({ 1: 'Low', 2: 'Medium', 3: 'High' }[v] || '') } },
                },
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c2) => riskPoints[c2.dataIndex].category } } },
                onClick: (evt, elements) => { if (elements.length) openRiskDetail(riskPoints[elements[0].index]); },
            },
        });
    }

    // AI Score Explanation
    document.getElementById('explainScoreBtn').addEventListener('click', () => {
        const textEl = document.getElementById('aiExplainText');
        if (textEl.classList.contains('visible')) { textEl.classList.remove('visible'); return; }
        textEl.classList.add('visible');
        if (r.report && r.report.executive_summary) {
            textEl.textContent = r.report.executive_summary;
        } else {
            const strong = strengths.slice(0, 2).map((c) => c.category);
            const weak = weaknesses.slice(0, 2).map((c) => c.category);
            textEl.textContent = `Your overall score of ${score.overall_score}/100 reflects a ${score.maturity_level} level of maturity.` +
                (strong.length ? ` Your strongest results came from ${strong.join(' and ')}.` : '') +
                (weak.length ? ` The score was reduced primarily by gaps in ${weak.join(' and ')}.` : '');
        }
    });
}

render();
</script>
</body>
</html>
